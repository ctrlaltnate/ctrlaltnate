name: Metrics
on:
  # ตั้งเวลาอัปเดตอัตโนมัติทุกๆ เที่ยงคืน
  schedule:
    - cron: "0 0 * * *"
  # ให้กดสั่งรันเองในแท็บ Actions ได้
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # การตั้งค่าพื้นฐาน
          user: ctrlaltnate
          template: terminal # << เปลี่ยนเป็น Terminal template
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok

          # 1. Isometric commit calendar (Full Year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year # << ตั้งค่าให้แสดงเต็มปี

          # 2. Starred topics
          plugin_topics: yes
          plugin_topics_limit: 15 # จำนวน topics ที่ต้องการให้แสดง
          plugin_topics_mode: starred # ดึงจาก topics ที่เราเคย star ไว้

          # Plugins เดิมของคุณ
          plugin_languages: yes