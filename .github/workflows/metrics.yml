name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Main card: profile and language statistics
      - name: Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{secrets.METRICS_TOKEN}}
          filename: github-metrics-main.svg

          user: ctrlaltnate
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          # Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Right card: isometric commit calendar
      - name: Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{secrets.METRICS_TOKEN}}
          filename: github-metrics-terminal.svg

          user: ctrlaltnate
          template: terminal
          # Show basic account information before the calendar.
          base: header, metadata
          config_timezone: Asia/Bangkok

          # Languages detected across contributed repositories
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Top repositories by lines of code added and removed
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 3
          plugin_lines_delay: 15


