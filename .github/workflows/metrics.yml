name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Main card: profile, languages, and a compact isometric calendar
      - name: Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-main.svg

          user: ctrlaltnate
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok

          # Half-year keeps the calendar readable in a 50% README column.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Languages
          plugin_languages: yes

      # Terminal card: compact calendar and starred topics
      - name: Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-terminal.svg

          user: ctrlaltnate
          template: terminal
          base: ""
          config_timezone: Asia/Bangkok

          # Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
