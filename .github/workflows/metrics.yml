name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Main card: profile and language statistics
      - name: Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-main.svg

          user: ctrlaltnate
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          # Languages
          plugin_languages: yes

      # Technology icons displayed below the GitHub username
      - name: Technology Topics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: github-metrics-topics.svg

          user: ctrlaltnate
          template: classic
          base: ""
          config_timezone: Asia/Bangkok

          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: activity

      # Right card: isometric commit calendar
      - name: Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-terminal.svg

          user: ctrlaltnate
          template: terminal
          # Show basic account information before the calendar.
          base: header, metadata
          config_timezone: Asia/Bangkok

          # Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
